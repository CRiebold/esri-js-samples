<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Ritmo de Lima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewDiv"></div>

    <div id="loadingOverlay" class="overlay">
      <div class="overlay-content">
        <div class="spinner"></div>
        <p>Cargando los edificios de Lima&hellip;</p>
      </div>
    </div>

    <div id="errorOverlay" class="overlay overlay--hidden">
      <div class="overlay-content">
        <p class="error-title">No se pudo cargar la capa de datos</p>
        <p id="errorMessage" class="error-message"></p>
      </div>
    </div>

    <header id="titleBlock">
      <h1>El Ritmo de Lima</h1>
      <p>Ocupación urbana simulada a lo largo del día</p>
      <div id="poweredBy">
        <span>Creado con ArcGIS Maps SDK for JavaScript</span>
        <img src="/esri-logo-white.png" alt="Esri" id="esriLogo" />
      </div>
    </header>

    <footer id="hud">
      <div class="clockLabel">Hora simulada</div>
      <div id="clock">00:00</div>

      <div id="timelineRow">
        <button id="playPauseBtn" type="button" aria-label="Pausar">
          <svg id="iconPause" viewBox="0 0 24 24" width="15" height="15"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
          <svg id="iconPlay" viewBox="0 0 24 24" width="15" height="15" hidden><path d="M7 4l14 8-14 8z" fill="currentColor"/></svg>
        </button>

        <input id="timeline" type="range" min="0" max="1440" step="1" value="0" aria-label="Hora del día" />
      </div>

      <div id="speedRow">
        <label for="speedSlider">Velocidad</label>
        <input id="speedSlider" type="range" min="0.25" max="4" step="0.25" value="1" aria-label="Velocidad de la animación" />
        <span id="speedValue">1.0&times;</span>
      </div>

      <p id="disclaimer">Datos de ocupación sintéticos, solo con fines demostrativos</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
